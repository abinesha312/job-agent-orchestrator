# Local development only. Credentials below are throwaway dev defaults, not secrets.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: job_agent_db
    environment:
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: job_agent
      POSTGRES_DB: job_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_agent -d job_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://job_agent:job_agent@db:5432/job_agent
      EMBEDDING_BACKEND: fake
      LLM_JUDGE: "off"
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
