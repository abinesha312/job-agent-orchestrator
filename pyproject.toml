[project]
name = "job-agent-orchestrator"
version = "0.1.0"
description = "ApplyPilot: a job-application copilot. Reads a resume, finds roles, drafts a tailored resume and a note, and waits for approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "httpx>=0.27",
]

[project.scripts]
applypilot-evals = "job_agent.cli:main"

[project.optional-dependencies]
llm = ["litellm>=1.50"]
evals = ["deepeval>=1.0"]
ui = ["streamlit>=1.38", "httpx>=0.27"]
tracing = ["langfuse>=2.0"]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "respx>=0.21",
    "reportlab>=4.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "db: requires a reachable Postgres+pgvector (set TEST_DATABASE_URL); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI File()/Query() defaults are idiomatic
